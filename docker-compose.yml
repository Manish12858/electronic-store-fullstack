services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-electronic_store}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-electronic_store}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-string-replace-with-a-long-random-string}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@demo.com}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin123}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-user@demo.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-user123}
    ports:
      - "9090:9090"
    volumes:
      - uploads:/app/images

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:9090
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
  uploads:
