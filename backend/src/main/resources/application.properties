server.port=${SERVER_PORT:9090}

# Database (override with environment variables, see .env.example)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:electronic_store}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
user.profile.image.path=${USER_IMAGE_PATH:images/users/}
product.image.path=${PRODUCT_IMAGE_PATH:images/products/}

# Security - never commit real secrets, pass them as environment variables
jwt.secret=${JWT_SECRET:change-me-local-dev-only-secret-key-change-me-local-dev-only}
admin.role.id=${ADMIN_ROLE_ID:role-admin}
normal.role.id=${NORMAL_ROLE_ID:role-normal}

# Google sign-in (optional)
googleClientId=${GOOGLE_CLIENT_ID:}
newPassword=${GOOGLE_LOGIN_PASSWORD:change-me-google-login}

# Demo accounts created on first start
app.demo.admin.email=${DEMO_ADMIN_EMAIL:admin@demo.com}
app.demo.admin.password=${DEMO_ADMIN_PASSWORD:admin123}
app.demo.user.email=${DEMO_USER_EMAIL:user@demo.com}
app.demo.user.password=${DEMO_USER_PASSWORD:user123}
